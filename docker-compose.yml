services:
  # ── Local PostgreSQL (for development/testing) ───────────────────
  db:
    image: postgres:16-alpine
    platform: linux/arm64/v8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digitak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitak_local}
      POSTGRES_DB: ${POSTGRES_DB:-digitak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitak"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    platform: linux/arm64/v8
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://digitak:digitak_local@db:5432/digitak
      DATABASE_URL_SYNC: postgresql+psycopg://digitak:digitak_local@db:5432/digitak
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  # ── Vite Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
