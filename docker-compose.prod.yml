services:
  # ── Production PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    platform: linux/arm64/v8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gofact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gofact}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofact"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    platform: linux/arm64/v8
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gofact}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gofact}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-gofact}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gofact}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Vite Frontend (Served via Nginx) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_prod:
